[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xerxes-tg"
version = "0.5.1"
description = "MCP server to work with Telegram through MTProto — with ACL and multi-agent setup"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Xerxes" },
]
keywords = ["mcp", "telegram", "mtproto", "telethon", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.1.0,<2",
    "telethon>=1.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "xdg-base-dirs>=6.0.0",
    "terminaltexteffects>=0.14.2",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
    "aiosqlite>=0.20.0",
    "anthropic>=0.40.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["xerxes_tg"]

[project.scripts]
xerxes-tg = "xerxes_tg:app"
