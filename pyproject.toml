[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-xerxes-tg"
version = "0.3.0"
description = "MCP server to work with Telegram through MTProto — with ACL and multi-agent setup"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Xerxes" },
]
keywords = ["mcp", "telegram", "mtproto", "telethon", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.1.0",
    "telethon>=1.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "xdg-base-dirs>=6.0.0",
    "terminaltexteffects>=0.14.2",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_telegram"]

[project.scripts]
mcp-telegram = "mcp_telegram:app"
xerxes-tg = "mcp_telegram:app"
